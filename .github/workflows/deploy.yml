name: Deploy

# Disabled 2026-11-11: gativcare.com was taken down from the VPS (/docker/gativcare removed).
# Restore the workflow_run trigger and the `if` below to re-enable auto-deploy.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: false
    steps:
      - name: Deploy to VPS over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            cd /docker/gativcare/app
            git pull origin main
            cd /docker/gativcare
            docker compose build gativcare gativcare-migrate
            docker compose run --rm gativcare-migrate
            docker compose up -d gativcare
            docker image prune -f
